<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>넓이 계산기</title>
    <style>
        /* 전체 페이지 스타일 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* 계산기 컨테이너 */
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        /* 도형 선택 섹션 */
        .shape-selector {
            margin-bottom: 30px;
        }

        .shape-selector label {
            display: block;
            margin-bottom: 10px;
            color: #555;
            font-weight: bold;
            font-size: 14px;
        }

        .shape-selector select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: border-color 0.3s ease;
        }

        .shape-selector select:focus {
            outline: none;
            border-color: #667eea;
        }

        /* 입력 필드 섹션 */
        .input-section {
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 15px;
            display: none;
        }

        .input-group.active {
            display: block;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        /* 계산 버튼 */
        .calculate-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-bottom: 20px;
        }

        .calculate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .calculate-btn:active {
            transform: translateY(0);
        }

        /* 결과 표시 영역 */
        .result-section {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 20px;
            border-radius: 8px;
            display: none;
        }

        .result-section.active {
            display: block;
        }

        .result-label {
            color: #666;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .result-value {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
            word-break: break-all;
        }

        .result-unit {
            color: #999;
            font-size: 14px;
            margin-top: 5px;
        }

        /* 공식 설명 */
        .formula {
            background: #e8eaf6;
            padding: 12px;
            border-radius: 6px;
            margin-top: 15px;
            font-size: 13px;
            color: #555;
            font-family: monospace;
            line-height: 1.6;
        }

        .error {
            color: #d32f2f;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        .error.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📐 넓이 계산기</h1>

        <!-- 도형 선택 부분: 사용자가 계산할 도형을 선택하는 곳 -->
        <div class="shape-selector">
            <label for="shapeSelect">계산할 도형을 선택하세요</label>
            <select id="shapeSelect">
                <option value="rectangle">직사각형 (가로 × 세로)</option>
                <option value="square">정사각형 (한 변의 길이)</option>
                <option value="triangle">삼각형 (밑변 × 높이 ÷ 2)</option>
                <option value="circle">원 (반지름)</option>
                <option value="parallelogram">평행사변형 (밑변 × 높이)</option>
                <option value="trapezoid">사다리꼴 ((윗변 + 아랫변) × 높이 ÷ 2)</option>
            </select>
        </div>

        <!-- 입력 필드 섹션: 각 도형별로 필요한 값을 입력 -->
        <div class="input-section">
            <!-- 직사각형 입력 필드 -->
            <div class="input-group active" id="rectangleInput">
                <label for="width">가로 (너비)</label>
                <input type="number" id="width" placeholder="예: 10" step="0.1">
                <label for="height" style="margin-top: 12px;">세로 (높이)</label>
                <input type="number" id="height" placeholder="예: 5" step="0.1">
            </div>

            <!-- 정사각형 입력 필드 -->
            <div class="input-group" id="squareInput">
                <label for="side">한 변의 길이</label>
                <input type="number" id="side" placeholder="예: 10" step="0.1">
            </div>

            <!-- 삼각형 입력 필드 -->
            <div class="input-group" id="triangleInput">
                <label for="triangleBase">밑변</label>
                <input type="number" id="triangleBase" placeholder="예: 10" step="0.1">
                <label for="triangleHeight" style="margin-top: 12px;">높이</label>
                <input type="number" id="triangleHeight" placeholder="예: 8" step="0.1">
            </div>

            <!-- 원 입력 필드 -->
            <div class="input-group" id="circleInput">
                <label for="radius">반지름</label>
                <input type="number" id="radius" placeholder="예: 5" step="0.1">
            </div>

            <!-- 평행사변형 입력 필드 -->
            <div class="input-group" id="parallelogramInput">
                <label for="parallelogramBase">밑변</label>
                <input type="number" id="parallelogramBase" placeholder="예: 10" step="0.1">
                <label for="parallelogramHeight" style="margin-top: 12px;">높이</label>
                <input type="number" id="parallelogramHeight" placeholder="예: 6" step="0.1">
            </div>

            <!-- 사다리꼴 입력 필드 -->
            <div class="input-group" id="trapezoidInput">
                <label for="trapezoidTop">윗변</label>
                <input type="number" id="trapezoidTop" placeholder="예: 6" step="0.1">
                <label for="trapezoidBottom" style="margin-top: 12px;">아랫변</label>
                <input type="number" id="trapezoidBottom" placeholder="예: 10" step="0.1">
                <label for="trapezoidHeight" style="margin-top: 12px;">높이</label>
                <input type="number" id="trapezoidHeight" placeholder="예: 5" step="0.1">
            </div>
        </div>

        <!-- 계산 버튼: 클릭하면 넓이가 계산됨 -->
        <button class="calculate-btn" onclick="calculateArea()">계산하기 🧮</button>

        <!-- 오류 메시지: 입력값이 잘못되면 표시됨 -->
        <div class="error" id="errorMessage"></div>

        <!-- 결과 표시 영역: 계산 결과가 여기에 나타남 -->
        <div class="result-section" id="resultSection">
            <div class="result-label">계산 결과</div>
            <div class="result-value"><span id="resultValue">0</span> <span id="resultUnit">m²</span></div>
            <div class="formula" id="formulaDisplay"></div>
        </div>
    </div>

    <script>
        // 도형 선택 드롭다운이 변경되었을 때 실행되는 함수
        // 이 함수는 사용자가 다른 도형을 선택할 때마다 호출됨
        document.getElementById('shapeSelect').addEventListener('change', function(event) {
            const selectedShape = event.target.value; // 선택된 도형 종류를 가져옴

            // 모든 입력 필드를 숨김 (display: none)
            // 왜냐하면 도형마다 필요한 입력값이 다르기 때문
            const allInputs = document.querySelectorAll('.input-group');
            allInputs.forEach(input => {
                input.classList.remove('active'); // 'active' 클래스 제거
            });

            // 결과 표시 영역도 숨김
            document.getElementById('resultSection').classList.remove('active');
            document.getElementById('errorMessage').classList.remove('active');

            // 선택된 도형에 맞는 입력 필드만 보여줌
            // 예를 들어, 직사각형을 선택하면 'rectangleInput'이 표시됨
            document.getElementById(selectedShape + 'Input').classList.add('active');
        });

        // 넓이를 계산하는 메인 함수
        // 선택된 도형의 종류에 따라 다른 공식을 사용해서 계산
        function calculateArea() {
            const selectedShape = document.getElementById('shapeSelect').value;
            let area; // 계산된 넓이가 저장될 변수
            let formula; // 사용된 공식을 표시할 변수
            const errorElement = document.getElementById('errorMessage');

            try {
                // 오류 메시지 초기화 (이전 오류가 표시되지 않도록)
                errorElement.classList.remove('active');
                errorElement.textContent = '';

                // 선택된 도형에 따라 다른 계산을 수행
                // switch 문은 여러 경우 중 하나를 선택하는 구조
                switch(selectedShape) {
                    case 'rectangle':
                        // 직사각형: 가로 × 세로
                        const width = parseFloat(document.getElementById('width').value);
                        const height = parseFloat(document.getElementById('height').value);

                        // 입력값이 유효한지 확인
                        if (!width || !height || width <= 0 || height <= 0) {
                            throw new Error('가로와 세로에 0보다 큰 숫자를 입력해주세요');
                        }

                        area = width * height;
                        formula = `가로(${width}) × 세로(${height}) = ${area}`;
                        break;

                    case 'square':
                        // 정사각형: 한 변 × 한 변
                        const side = parseFloat(document.getElementById('side').value);

                        if (!side || side <= 0) {
                            throw new Error('한 변의 길이에 0보다 큰 숫자를 입력해주세요');
                        }

                        area = side * side;
                        formula = `한 변(${side}) × 한 변(${side}) = ${area}`;
                        break;

                    case 'triangle':
                        // 삼각형: (밑변 × 높이) ÷ 2
                        const triangleBase = parseFloat(document.getElementById('triangleBase').value);
                        const triangleHeight = parseFloat(document.getElementById('triangleHeight').value);

                        if (!triangleBase || !triangleHeight || triangleBase <= 0 || triangleHeight <= 0) {
                            throw new Error('밑변과 높이에 0보다 큰 숫자를 입력해주세요');
                        }

                        area = (triangleBase * triangleHeight) / 2;
                        formula = `(밑변(${triangleBase}) × 높이(${triangleHeight})) ÷ 2 = ${area}`;
                        break;

                    case 'circle':
                        // 원: π × 반지름²
                        const radius = parseFloat(document.getElementById('radius').value);

                        if (!radius || radius <= 0) {
                            throw new Error('반지름에 0보다 큰 숫자를 입력해주세요');
                        }

                        area = Math.PI * radius * radius; // Math.PI는 파이(3.14159...)
                        formula = `π × 반지름²(${radius}²) = π × ${radius * radius} = ${area.toFixed(2)}`;
                        break;

                    case 'parallelogram':
                        // 평행사변형: 밑변 × 높이
                        const parallelogramBase = parseFloat(document.getElementById('parallelogramBase').value);
                        const parallelogramHeight = parseFloat(document.getElementById('parallelogramHeight').value);

                        if (!parallelogramBase || !parallelogramHeight || parallelogramBase <= 0 || parallelogramHeight <= 0) {
                            throw new Error('밑변과 높이에 0보다 큰 숫자를 입력해주세요');
                        }

                        area = parallelogramBase * parallelogramHeight;
                        formula = `밑변(${parallelogramBase}) × 높이(${parallelogramHeight}) = ${area}`;
                        break;

                    case 'trapezoid':
                        // 사다리꼴: ((윗변 + 아랫변) × 높이) ÷ 2
                        const trapezoidTop = parseFloat(document.getElementById('trapezoidTop').value);
                        const trapezoidBottom = parseFloat(document.getElementById('trapezoidBottom').value);
                        const trapezoidHeight = parseFloat(document.getElementById('trapezoidHeight').value);

                        if (!trapezoidTop || !trapezoidBottom || !trapezoidHeight ||
                            trapezoidTop <= 0 || trapezoidBottom <= 0 || trapezoidHeight <= 0) {
                            throw new Error('윗변, 아랫변, 높이에 0보다 큰 숫자를 입력해주세요');
                        }

                        area = ((trapezoidTop + trapezoidBottom) * trapezoidHeight) / 2;
                        formula = `((윗변(${trapezoidTop}) + 아랫변(${trapezoidBottom})) × 높이(${trapezoidHeight})) ÷ 2 = ${area}`;
                        break;
                }

                // 계산이 성공하면 결과를 표시
                displayResult(area, formula);

            } catch(error) {
                // 오류가 발생하면 오류 메시지를 표시
                errorElement.textContent = '❌ ' + error.message;
                errorElement.classList.add('active');
                document.getElementById('resultSection').classList.remove('active');
            }
        }

        // 계산 결과를 화면에 표시하는 함수
        function displayResult(area, formula) {
            // 결과 값을 소수점 2자리까지만 표시
            const roundedArea = Math.round(area * 100) / 100;

            // HTML에서 결과값을 업데이트
            document.getElementById('resultValue').textContent = roundedArea;
            document.getElementById('formulaDisplay').textContent = '📝 공식: ' + formula;

            // 결과 섹션을 보이게 함
            document.getElementById('resultSection').classList.add('active');
        }

        // Enter 키를 눌렀을 때도 계산이 되도록 설정
        // 이렇게 하면 마우스로 버튼을 클릭하지 않아도 됨
        document.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                calculateArea();
            }
        });
    </script>
</body>
</html>
